[project]
name = "infra-drift-detector"
version = "0.1.0"
description = "Enterprise read-only GitOps infrastructure drift detector for Linux systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "cibi-dev", email = "cibi-dev@users.noreply.github.com" }
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<7.0",
    "bandit>=1.7,<2.0",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
infra-drift = "drift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^examples/',
    '^\.venv/',
]
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/drift --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/drift"]
omit = ["tests/*", "benchmarks/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refactorer"]

[project]
name = "langgraph-type-coverage-refactorer"
version = "0.1.0"
description = "Multi-agent AST refactoring engine for strict MyPy typing and automated branch test coverage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Juan De Andrade", email = "cibi@example.local" }
]
keywords = [
    "langgraph",
    "type-checking",
    "mypy",
    "pytest",
    "code-coverage",
    "ast-refactoring",
    "multi-agent",
    "devsecops"
]
dependencies = [
    "pydantic>=2.7,<3",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint>=4.1,<5",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "mypy>=1.10,<3",
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "coverage>=7.0,<8",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "cyclonedx-bom>=3.11",
    "pytest-asyncio>=0.24",
]

[project.scripts]
refactorer = "refactorer.cli:main"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^examples/',
    '^\.venv/',
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src/refactorer"]
branch = true
omit = [
    "tests/*",
    "benchmarks/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv"]
skips = ["B101"]

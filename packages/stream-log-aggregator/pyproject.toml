[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-log-aggregator"
version = "0.1.0"
description = "Enterprise-grade high-performance async multi-channel log ingestion daemon with PII sanitization, grok parsing, backpressure, and persistent disk buffer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "cibi-dev", email = "cibi-dev@users.noreply.github.com" }
]
keywords = [
    "logstash",
    "syslog",
    "log-aggregator",
    "asyncio",
    "backpressure",
    "pii-sanitizer",
    "grok",
    "disk-buffer",
    "devsecops",
    "security"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "bandit>=1.7",
    "mypy>=1.8",
    "cyclonedx-python-lib>=6.0",
]

[project.scripts]
stream-log-aggregator = "aggregator.cli:main"
log-aggregator = "aggregator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --cov=aggregator --cov-report=term-missing --cov-fail-under=90"

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv"]
skips = ["B101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^examples/',
    '^\.venv/',
]